name: R package check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-check:
    name: Package check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Check package
        env:
          # skip_on_cran() skips unless NOT_CRAN is "true"; without this the
          # cross-platform run silently skips the very tests it exists to run.
          NOT_CRAN: "true"
        run: >
          Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"),
          error_on = "warning")'

  release-validation:
    name: Release validation (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: Verify versioned M4 coverage report
        run: Rscript scripts/m4_coverage_report.R
      - name: Verify versioned M5 DA release
        run: Rscript scripts/m5_validate_release.R
      - name: Audit immutable release index
        run: Rscript scripts/m6_release_controls.R
