# No `url:` on purpose: the pkgdown site is built on demand (see `destination:`)
# and is not published. A site URL here must also appear in DESCRIPTION, and
# https://lennon-li.github.io/OPCC/ currently returns 404 (no GitHub Pages),
# which `R CMD check --as-cran` flags as a dead URL.
# Consequence: `pkgdown::check_pkgdown()` fails with "url is missing". That is
# expected and harmless -- `pkgdown::build_site()` works. To publish later,
# enable Pages, then add the same URL here and to DESCRIPTION's URL field.
destination: docs/site
template:
  bootstrap: 5
reference:
  - title: OPCC package
    contents:
      - OPCC-package
  - title: Correspondence lookups
    contents:
      - normalize_postal_code
      - get_correspondence
      - get_da_correspondence
      - pc_to_geo
      - pc_to_point
  - title: Release verification
    contents:
      - list_vintages
      - clear_opcc_cache
      - release_manifest
      - validate_release
  - title: Local source layers
    contents:
      - new_source_adapter
      - validate_source_data
      - build_source_layer
      - profile_source_layer
      - contribution_bundle
      - contribution_issue_url
      - open_contribution_issue
  - title: Interactive app
    contents:
      - run_app
      - download_da_boundaries
      - export_postal_points
  - title: Rebuild artifacts from source
    contents:
      - download_nar
      - download_geonames
      - download_gaf
      - download_census_boundaries
      - build_centroids
      - build_db_assignment
      - build_m2
      - aggregate_da_correspondence
      - geonames_supplementary_adapter
